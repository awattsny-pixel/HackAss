name: CI

# Verification only: no deployment, no secrets, no live-service credentials. All configuration used by the
# build and the smoke run is dummy or generated locally by the test harness.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # the Gitleaks history scan needs every commit

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile only, no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Install pinned Gitleaks (SHA-256 verified against scripts/gitleaks-pin.json)
        run: node scripts/install-gitleaks.mjs

      - name: Secret scan (Gitleaks, working tree and full history)
        run: npm run scan:gitleaks

      - name: Secret scan (in-repo scanner, supplementary)
        run: npm run scan:secrets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and containment tests
        run: npm test
        env:
          REQUIRE_GITLEAKS: '1' # the real-binary Gitleaks tests must run, not skip

      - name: Production build (dummy configuration)
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          SUPABASE_URL: http://127.0.0.1:9
          SUPABASE_SERVICE_KEY: dummy
          SUPABASE_SERVICE_ROLE_KEY: dummy
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Isolated smoke checks (local fixture server only)
        run: npm run smoke

  # Real local Supabase stack (Auth, PostgREST, Storage, Postgres in containers) and the pgTAP database tests.
  # Added in F1 and NOT yet run on a machine with Docker; the first GitHub run is its first verification.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start the local Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Database tests (pgTAP)
        run: supabase test db

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup

  # Real `next build` proofs of the server/client boundary: a server route importing the server-only platform surface
  # must build; a Client Component importing it must fail with the server-only error. Runs in a throwaway copy.
  server-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Probe the build-time boundary
        run: npm ci --ignore-scripts && npm run probe:server-boundary
